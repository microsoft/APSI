# This defines a pipeline to build on Windows, Linux, and macOS in Debug mode.

trigger:
  batch: true
  branches:
    include:
    - main 
  paths:
    exclude:
    - CHANGES.md
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE
    - README.md
    - SECURITY.md

# CodeQL is an explicit Release-only gate, initialized after dependency configuration so it
# wraps the APSI build alone (see windows.yml). With no CodeQL task present, policy instead
# auto-injects one at the start of the job, which instruments vcpkg's from-source dependency
# build as well, which grows configure time hugely and causes a job agent timeout.
variables:
  Codeql.SkipTaskAutoInjection: true

stages:
  - stage: build
    displayName: Build
    jobs:
    - template: jobs.yml
      parameters:
        debug: true
        name: Windows
    - template: jobs.yml
      parameters:
        debug: true
        name: WindowsArm64
    - template: jobs.yml
      parameters:
        debug: true
        name: Linux
    - template: jobs.yml
      parameters:
        debug: true
        name: macOS
