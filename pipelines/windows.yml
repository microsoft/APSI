steps:
- task: Powershell@2
  displayName: 'Bootstrap vcpkg'
  inputs:
    targetType: 'inline'
    script: |
      $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
      git clone https://github.com/microsoft/vcpkg.git
      cd vcpkg
      git checkout $baseline
      .\bootstrap-vcpkg.bat -disableMetrics
    workingDirectory: '$(Build.SourcesDirectory)'

# Dependencies are resolved from vcpkg.json at the project root. CMake configure
# drives the install via the vcpkg toolchain file.
- task: CMake@1
  displayName: 'Configure APSI'
  inputs:
    cmakeArgs: .. -DCMAKE_BUILD_TYPE='${{ parameters.configuration }}' -DAPSI_BUILD_TESTS=ON -DVCPKG_MANIFEST_FEATURES=tests -DCMAKE_TOOLCHAIN_FILE=$(Build.SourcesDirectory)\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
    workingDirectory: '$(Build.SourcesDirectory)/build'

- ${{ if eq(parameters.configuration, 'Release') }}:
  - task: CodeQL3000Init@0

- task: MSBuild@1
  displayName: 'Build APSI'
  inputs:
    solution: '$(Build.SourcesDirectory)/build/apsi.sln'
    msbuildArchitecture: 'x64'
    platform: 'x64'
    configuration: '${{ parameters.configuration }}'

- ${{ if eq(parameters.configuration, 'Release') }}:
  - task: CodeQL3000Finalize@0

- script: '${{ parameters.configuration }}\unit_tests.exe'
  workingDirectory: '$(Build.SourcesDirectory)\build\bin'
  displayName: 'Run unit tests'

# Integration tests are Release-only: a Debug build links vcpkg's unoptimized SEAL, which
# makes the homomorphic operations 10-20x slower and the suite impractical as a gate.
# The Large and Huge cases are DISABLED_ in the source, so only the small and medium ones
# run here. Add --gtest_also_run_disabled_tests before tagging a release.
- ${{ if eq(parameters.configuration, 'Release') }}:
  - script: '${{ parameters.configuration }}\integration_tests.exe'
    workingDirectory: '$(Build.SourcesDirectory)\build\bin'
    displayName: 'Run integration tests'

- task: PublishSymbols@2
  displayName: 'Publish symbols path'
  inputs:
    searchPattern: '**\bin\**\*.pdb'
    PublishSymbols: false
  continueOnError: true

- task: CopyFiles@2
  displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)\build\bin'
    Contents: |
      ${{ parameters.configuration }}\**\?(*.exe|*.dll|*.lib|*.xml)
    TargetFolder: '$(Build.ArtifactStagingDirectory)'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: windows-drop

- ${{ if eq(parameters.configuration, 'Release') }}:
  - task: CredScan@3
    displayName: 'Credential Scan'

  - task: ComponentGovernanceComponentDetection@0
    displayName: 'Component Detection'
    inputs:
      scanType: 'Register'
      verbosity: 'Verbose'
      alertWarningLevel: 'High'

- task: PublishSecurityAnalysisLogs@3
  displayName: 'Publish Security Analysis Logs'
  inputs:
    ArtifactName: 'CodeAnalysisLogs'
    ArtifactType: 'Container'
    PublishProcessedResults: true
    AllTools: true
    ToolLogsNotFoundAction: 'Standard'
