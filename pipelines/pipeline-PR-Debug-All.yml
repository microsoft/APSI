# This defines a pipeline to build on Windows, Linux, and macOS in Debug mode.

pr:
  branches:
    include:
    - contrib
  paths:
    exclude:
    - CHANGES.md
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md
    - LICENSE
    - README.md
    - SECURITY.md

# See pipeline-CI-Debug-All.yml: CodeQL is a Release-only gate, and policy auto-injection would
# instrument vcpkg's dependency build and push the job past the agent timeout.
variables:
  Codeql.SkipTaskAutoInjection: true

stages:
  - stage: build
    displayName: Build
    jobs:
    - template: jobs.yml
      parameters:
        debug: true
        name: Windows
    - template: jobs.yml
      parameters:
        debug: true
        name: Linux
    - template: jobs.yml
      parameters:
        debug: true
        name: macOS
