steps:

- task: CmdLine@2
  displayName: 'Bootstrap vcpkg'
  inputs:
    script: |
      BASELINE=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
      git clone https://github.com/microsoft/vcpkg.git
      cd vcpkg
      git checkout $BASELINE
      ./bootstrap-vcpkg.sh -disableMetrics
    workingDirectory: '$(Build.SourcesDirectory)'
    failOnStderr: false

# Dependencies are resolved from vcpkg.json at the project root. CMake configure
# drives the install via the vcpkg toolchain file.
- task: CMake@1
  displayName: 'CMake APSI'
  inputs:
    workingDirectory: '$(Build.SourcesDirectory)'
    cmakeArgs: '-DCMAKE_BUILD_TYPE=${{ parameters.configuration }} -DAPSI_BUILD_TESTS=ON -DVCPKG_MANIFEST_FEATURES=tests -DCMAKE_TOOLCHAIN_FILE=$(Build.SourcesDirectory)/vcpkg/scripts/buildsystems/vcpkg.cmake .'

- script: |
      cd $BUILD_SOURCESDIRECTORY
      make
  displayName: 'Build APSI'

- script: |
      cd $BUILD_SOURCESDIRECTORY
      ./bin/unit_tests
  displayName: 'Run unit tests'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
  inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: ${{ parameters.artifactName }}
