# This defines a pipeline to build on Windows, Linux, and macOS in Release mode.

trigger: none

# CodeQL is an explicit Release-only gate: windows.yml initializes it after the dependency
# configuration so it wraps the APSI build alone. Where no CodeQL task is present, policy
# injects one at the start of the job instead, which also instruments vcpkg's from-source
# dependency build and pushes the job past the agent timeout, so every job opts out of the
# automatic injection and only the explicit tasks run.
variables:
  Codeql.SkipTaskAutoInjection: true

stages:
  - stage: build
    displayName: Build
    jobs:
    - template: jobs.yml
      parameters:
        debug: false
        name: Windows
    - template: jobs.yml
      parameters:
        debug: false
        name: WindowsArm64
    - template: jobs.yml
      parameters:
        debug: false
        name: Linux
    - template: jobs.yml
      parameters:
        debug: false
        name: macOS
